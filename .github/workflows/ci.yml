name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: |
          cd Clipipi
          xcodebuild -scheme Clipipi -configuration Debug build \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          cd Clipipi
          xcodebuild test -scheme Clipipi \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
